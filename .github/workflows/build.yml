# Builds the Couch Phone APK on every push and puts it on the Releases page.
#
# Signing: every release is signed with the same key (signing/couch-phone.p12), so a new APK
# installs over the old one. The key is locked with a password kept in the repository secret
# SIGNING_PASSWORD. Without that secret the build still runs (to check the code), but makes
# no release.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      HAS_KEY: ${{ secrets.SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remote/package-lock.json

      - name: Build the phone remote
        working-directory: remote
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      # The TV pointer's helper (android/native/couchmouse.c), a small program the app runs as root.
      # Built with the Android NDK that GitHub's runners already have, for 64-bit and 32-bit phones.
      - name: Build the mouse helper
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then echo "::error::No Android NDK on this runner"; exit 1; fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT=android/app/src/main/jniLibs
          mkdir -p "$OUT/arm64-v8a" "$OUT/armeabi-v7a"
          "$BIN/aarch64-linux-android29-clang" -O2 -Wall -Wextra -Werror -o "$OUT/arm64-v8a/libcouchmouse.so" android/native/couchmouse.c
          "$BIN/armv7a-linux-androideabi29-clang" -O2 -Wall -Wextra -Werror -o "$OUT/armeabi-v7a/libcouchmouse.so" android/native/couchmouse.c
          "$BIN/llvm-strip" "$OUT"/*/libcouchmouse.so
          file "$OUT"/*/libcouchmouse.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            export COUCHPHONE_KEYSTORE="$GITHUB_WORKSPACE/signing/couch-phone.p12"
            export COUCHPHONE_KEY_PASSWORD="$SIGNING_PASSWORD"
          else
            echo "::warning::SIGNING_PASSWORD secret is not set: this build is a test only and makes no release. See README, 'One-time setup'."
          fi
          gradle -p android --no-daemon :remote-app:assembleRelease :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/couch-phone-$VERSION_NAME.apk"
          cp android/remote-app/build/outputs/apk/release/remote-app-release.apk "out/couch-remote-$VERSION_NAME.apk"
          ls -la out
          # the mouse helper must be inside the APK
          unzip -l "out/couch-phone-$VERSION_NAME.apk" | grep libcouchmouse.so
          # and the remote app inside it, for the TV's "Connect a remote" screen
          unzip -l "out/couch-phone-$VERSION_NAME.apk" | grep assets/remote-app/couch-remote.apk

      - name: Check the signature
        if: ${{ env.HAS_KEY == 'true' }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "out/couch-phone-$VERSION_NAME.apk" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: couch-phone-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publish a release
        if: ${{ env.HAS_KEY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Couch Phone ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: out/*.apk
          body: |
            Download **couch-phone-${{ env.VERSION_NAME }}.apk** below and open it on the Galaxy S10e.
            It installs over any earlier Couch Phone release.

            **couch-remote-${{ env.VERSION_NAME }}.apk** is the remote as an Android app, for your phone
            (the TV also hands it out: "Connect a remote" on the TV home).

            Built from `${{ github.sha }}` on branch `${{ github.ref_name }}`.
